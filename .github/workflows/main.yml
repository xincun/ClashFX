name: ClashFX

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: core-engine/go.mod
          cache-dependency-path: core-engine/go.sum

      - name: Verify deployment SDK floor
        run: python3 scripts/verify-release-compatibility.py --sdk

      - name: Compute release version & channel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF##*/}"
            seg_count=$(echo "$tag" | awk -F. '{print NF}')
            if [ "$seg_count" -ge 4 ]; then
              echo "RELEASE_CHANNEL=lab" >> "$GITHUB_ENV"
            else
              echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
            fi
          else
            base=$(git describe --abbrev=0 2>/dev/null || echo "1.19.24")
            tag="${base}.$(date '+%m%d%H%M%S')"
            echo "RELEASE_CHANNEL=lab" >> "$GITHUB_ENV"
          fi
          build_number=$(echo "$tag" | awk -F. '{ printf "%d%03d%03d%03d", $1, $2, $3, ($4 == "" ? 0 : $4) }')
          echo "TAG_VERSION=$tag" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Version: $tag (build $build_number)"

      - name: Build Universal macOS App, PKG & DMG
        run: |
          python3 macos/scripts/build-core.py
          python3 macos/scripts/build-daemon.py --version "$TAG_VERSION"
          python3 macos/scripts/build-ui.py
          python3 macos/scripts/stage-app.py --version "$TAG_VERSION" --build-number "$BUILD_NUMBER"
          python3 scripts/verify-release-compatibility.py --app macos/dist/ClashFX.app
          bash scripts/verify-dashboard-compatibility-bundle.sh macos/dist/ClashFX.app
          codesign --verify --deep --strict --verbose=2 macos/dist/ClashFX.app
          python3 macos/scripts/package-pkg.py --version "$TAG_VERSION"
          python3 macos/scripts/package-dmg.py

      - name: Verify mounted DMG & expanded PKG contents
        run: |
          DMG_VERIFY_DIR=$(mktemp -d /tmp/clashfx-dmg-verify.XXXXXX)
          DMG_MOUNT_POINT="$DMG_VERIFY_DIR/mount"
          mkdir -p "$DMG_MOUNT_POINT"
          cleanup_dmg() {
            hdiutil detach "$DMG_MOUNT_POINT" -quiet 2>/dev/null || true
            rm -rf "$DMG_VERIFY_DIR" 2>/dev/null || true
          }
          trap cleanup_dmg EXIT
          hdiutil attach macos/dist/ClashFX.dmg -nobrowse -readonly -mountpoint "$DMG_MOUNT_POINT"
          test -f "$DMG_MOUNT_POINT/ClashFX.pkg"
          pkgutil --expand-full "$DMG_MOUNT_POINT/ClashFX.pkg" "$DMG_VERIFY_DIR/expanded"
          EXPANDED_APP="$DMG_VERIFY_DIR/expanded/ClashFX-component.pkg/Payload/Applications/ClashFX.app"
          python3 scripts/verify-release-compatibility.py --app "$EXPANDED_APP"
          bash scripts/verify-dashboard-compatibility-bundle.sh "$EXPANDED_APP"

      - name: Go core-engine tests & Appcast release-notes regression
        run: |
          (
            cd core-engine
            CLASHFX_DISABLE_OS_SYSPROXY=1 CLASHFX_DISABLE_LAUNCH_AGENT=1 CLASHFX_DISABLE_LEGACY_PLIST_MIGRATION=1 CLASHFX_DISABLE_PRIVILEGED_SERVICE=1 \
              go test -race -count=1 ./...
          )
          python3 scripts/test_appcast_release_notes.py

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            macos/dist/ClashFX.dmg
            macos/dist/ClashFX.pkg
          draft: false
          prerelease: ${{ env.RELEASE_CHANNEL == 'lab' }}
          body_path: RELEASE_NOTES.md

      - name: Notify website repos
        if: startsWith(github.ref, 'refs/tags/') && vars.ENABLE_WEBSITE_DISPATCH == 'true'
        env:
          WEBSITE_PAT: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          tag=${GITHUB_REF##*/}
          DATE=$(date -u +%Y-%m-%d)
          NOTES=$(head -50 RELEASE_NOTES.md | jq -Rs .)

          CHANGE_TYPE="fix"
          if grep -q "New Features\|### 新功能" RELEASE_NOTES.md 2>/dev/null; then
            CHANGE_TYPE="feat"
          fi
          DESC_EN=$(python3 scripts/appcast_release_notes.py summary en)
          DESC_ZH=$(python3 scripts/appcast_release_notes.py summary zh)
          DESC_EN=${DESC_EN:-"See release notes on GitHub"}
          DESC_ZH=${DESC_ZH:-"详见 GitHub Release Notes"}

          PAYLOAD=$(jq -n \
            --arg version "$tag" \
            --arg date "$DATE" \
            --arg product "clashfx" \
            --arg change_type "$CHANGE_TYPE" \
            --arg desc_en "$DESC_EN" \
            --arg desc_zh "$DESC_ZH" \
            --argjson notes "$NOTES" \
            '{
              event_type: "clashfx-release",
              client_payload: {
                product: $product,
                version: $version,
                date: $date,
                change_type: $change_type,
                desc_en: $desc_en,
                desc_zh: $desc_zh,
                release_notes: $notes,
                download_url: "https://github.com/Clash-FX/ClashFX/releases/download/\($version)/ClashFX.dmg"
              }
            }')

          curl -sf -X POST \
            -H "Authorization: token $WEBSITE_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/mixc6763-prog/ClashFX-web/dispatches \
            -d "$PAYLOAD" && echo "Notified ClashFX-web" || echo "Failed to notify ClashFX-web"

          curl -sf -X POST \
            -H "Authorization: token $WEBSITE_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/mixc6763-prog/ClashX.Web/dispatches \
            -d "$PAYLOAD" && echo "Notified ClashX.Web" || echo "Failed to notify ClashX.Web"
